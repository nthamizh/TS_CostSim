# Local development compose — brings up all services on non-conflicting ports.
# CostSim uses port offsets: +2 from ConfigIQ (4001→4003 not used, 5174→5175).
name: costsimulator-dev

services:
  costsim-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: costsim
      POSTGRES_PASSWORD: costsim
      POSTGRES_DB: costsim
    ports: ["5433:5432"]
    volumes: [costsim_pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U costsim"]
      interval: 5s; timeout: 5s; retries: 10

  costsim-redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    volumes: [costsim_redis_data:/data]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s; timeout: 3s; retries: 10

  costsim-minio:
    image: minio/minio:latest
    command: server /data --console-address ":9003"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9002:9000","9003:9003"]
    volumes: [costsim_minio_data:/data]
    healthcheck:
      test: ["CMD","curl","-f","http://localhost:9000/minio/health/live"]
      interval: 10s; timeout: 5s; retries: 5

volumes:
  costsim_pg_data:
  costsim_redis_data:
  costsim_minio_data:
